name: CD Azure (preview)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      preview_name:
        description: 'Name of the deployment environment'
        type: string
        required: true

permissions:
  pull-requests: write
  id-token: write

jobs:
  preview:
    name: Build & Deploy to preview

    runs-on: ubuntu-latest

    env:
      PREVIEW_NAME: ${{ github.event.pull_request.number || github.event.inputs.preview_name }}
      RESOURCE_GROUP: JabRefOnline
      STATIC_SITE_NAME: jabref-online

    steps:
      # We could also add these checks to a job-wide if condition, to skip the workflow if its unsecure to run.
      # However, Github views skipped workflows as "successful" and thus one could merge a PR without running this workflow first.
      - name: Fail if unsecure
        if: "github.event_name != 'workflow_dispatch' && !contains(github.event.pull_request.labels.*.name, 'status: safe to test') && github.actor != 'tobiasdiez' && github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]' && github.actor != 'copilot-swe-agent'"
        run: |
          echo "The workflow was triggered by ${{ github.actor }} and the PR is not labeled as 'safe to test'. For security reasons, we do not run this workflow in this case."
          exit 1

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build:azure
        env:
          NUXT_SESSION_PASSWORD: ${{ secrets.AZURE_SESSION_SECRET }} # Needed for prerending

      - name: Login to Azure
        uses: Azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create test database on Azure
        id: create_db
        run: |
          name="postgres_test_${PREVIEW_NAME}"
          pwd=$(az account get-access-token --resource-type oss-rdbms --output tsv --query accessToken)
          connection_string="postgresql://Github:${pwd}@${DB_NAME}.postgres.database.azure.com:5432/${name}?sslmode=require"
          echo "::add-mask::$connection_string"
          echo "db_url=$connection_string" >> "$GITHUB_OUTPUT"

          NUXT_DATABASE_URL="$connection_string" pnpm prisma:migrate:reset --force
          NUXT_DATABASE_URL="$connection_string" pnpm prisma:seed
        env:
          DB_NAME: ${{ secrets.AZURE_DATABASE_NAME }}

      - name: Cleanup deployment
        run: |
          # Nuxt/nitro can create symlinks to replicate parts of node_modules.
          # Replace symlinks with real copies so the deploy payload is self-contained.
          python - <<'PY'
          import shutil
          from pathlib import Path

          root = Path('.output/server')
          for path in sorted(root.rglob('*')):
              if path.is_symlink():
                  target = path.resolve()
                  path.unlink()
                  if target.is_dir():
                      shutil.copytree(target, path)
                  else:
                      path.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(target, path)
          PY

      - name: Deploy with Azure Static Web Apps action
        id: builddeploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_PEBBLE_0224C3803 }}
          repo_token: ${{ github.token }}
          action: 'upload'
          deployment_environment: ${{ env.PREVIEW_NAME }}
          app_location: '.output/public'
          api_location: '.output/server'
          skip_app_build: true
          skip_api_build: true

      - name: Configure Static Web App environment settings
        run: |
          redis_host=$(az redis show --name jabref --resource-group "$RESOURCE_GROUP" --query hostName --output tsv)
          redis_password=$(az redis list-keys --name jabref --resource-group "$RESOURCE_GROUP" --query primaryKey --output tsv)
          email_connection_string=$(az communication list-key --name JabRefCommunication --resource-group "$RESOURCE_GROUP" --query primaryConnectionString --output tsv)

          az staticwebapp appsettings set --name "$STATIC_SITE_NAME" --resource-group "$RESOURCE_GROUP" --environment-name "$PREVIEW_NAME" --setting-names \
            "NODE_ENV=production" \
            "NUXT_DATABASE_URL=${{ steps.create_db.outputs.db_url }}" \
            "NUXT_SESSION_PASSWORD=${{ secrets.AZURE_SESSION_SECRET }}" \
            "NUXT_GITHUB_REPO_TOKEN=${{ secrets.GITHUBS_REPO_TOKEN }}" \
            "NUXT_REDIS_HOST=$redis_host" \
            "NUXT_REDIS_PORT=6380" \
            "NUXT_REDIS_PASSWORD=$redis_password" \
            "NUXT_EMAIL_CLIENT=$email_connection_string" \
            "NUXT_SITE_URL=preview"

      - name: Check HTTP status
        run: |
          sleep 30
          curl -s -w 'Establish Connection: %{time_connect}s\nTTFB: %{time_starttransfer}s\nTotal: %{time_total}s\n' ${{ steps.builddeploy.outputs.static_web_app_url }} || true
          curl -s -w 'Establish Connection: %{time_connect}s\nTTFB: %{time_starttransfer}s\nTotal: %{time_total}s\n' ${{ steps.builddeploy.outputs.static_web_app_url }}/api || true
        # The api returns 400 status code for some reason
        # uses: gerdemann/http-status-code@1.0.0
        # with:
        #   url: ${{ steps.builddeploy.outputs.static_web_app_url }}/api
        #   code: 200
        #   timeout: 300 # initial warm up can take quite some time
        #   interval: 30

      - name: Report URL as PR comment
        if: github.event_name == 'pull_request_target'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          message: |
            Deployed ${{ github.sha }} to ${{ steps.builddeploy.outputs.static_web_app_url }}

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          TEST_URL: ${{ steps.builddeploy.outputs.static_web_app_url }}
          # The tests need these tokens to run, but their actual value should not matter
          NUXT_GITHUB_REPO_TOKEN: 'SIGNAL_TO_RUN_TEST'
          # Re-enable when email sending in the test environment is fixed
          # NUXT_EMAIL_CLIENT: 'SIGNAL_TO_RUN_TEST'
