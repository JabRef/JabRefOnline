name: CD Azure

on:
  push:
    branches:
      - main

permissions:
  pull-requests: write
  id-token: write

jobs:
  build_and_deploy:
    name: Build & Deploy to ${{ matrix.environment }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: Test
            url: https://dev.www.jabref.org
            deployment_environment: dev
            site_url_setting: preview
          - environment: Staging
            url: https://staging.www.jabref.org
            deployment_environment: staging
            site_url_setting: preview
          - environment: Production
            url: https://www.jabref.org
            deployment_environment: default
            site_url_setting: production

    environment:
      name: ${{ matrix.environment }}
      url: ${{ matrix.url }}

    env:
      RESOURCE_GROUP: JabRefOnline
      STATIC_SITE_NAME: jabref-online
      DATABASE_URL: ${{ matrix.environment == 'Test' && secrets.AZURE_TEST_DATABASE_URL || secrets.AZURE_DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Reset Test database on Azure
        if: matrix.environment == 'Test'
        run: |
          pnpm prisma:migrate:reset --force
          pnpm prisma:seed
        env:
          NUXT_DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Update Production database on Azure
        if: matrix.environment == 'Staging'
        run: pnpm prisma:migrate:deploy
        env:
          NUXT_DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Build
        run: pnpm build:azure
        env:
          NUXT_SESSION_PASSWORD: ${{ secrets.AZURE_SESSION_SECRET }} # Needed for prerending

      - name: Cleanup deployment
        run: |
          # Nuxt/nitro can create symlinks to replicate parts of node_modules.
          # Replace symlinks with real copies so the deploy payload is self-contained.
          python - <<'PY'
          import shutil
          from pathlib import Path

          root = Path('.output/server')
          for path in sorted(root.rglob('*')):
              if path.is_symlink():
                  target = path.resolve()
                  path.unlink()
                  if target.is_dir():
                      shutil.copytree(target, path)
                  else:
                      path.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(target, path)
          PY

      - name: Deploy with Azure Static Web Apps action
        id: builddeploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_PEBBLE_0224C3803 }}
          repo_token: ${{ github.token }}
          action: 'upload'
          deployment_environment: ${{ matrix.deployment_environment }}
          app_location: '.output/public'
          api_location: '.output/server'
          skip_app_build: true
          skip_api_build: true

      - name: Login to Azure
        uses: Azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Static Web App environment settings
        run: |
          redis_host=$(az redis show --name jabref --resource-group "$RESOURCE_GROUP" --query hostName --output tsv)
          redis_password=$(az redis list-keys --name jabref --resource-group "$RESOURCE_GROUP" --query primaryKey --output tsv)
          email_connection_string=$(az communication list-key --name JabRefCommunication --resource-group "$RESOURCE_GROUP" --query primaryConnectionString --output tsv)

          az staticwebapp appsettings set --name "$STATIC_SITE_NAME" --resource-group "$RESOURCE_GROUP" --environment-name "${{ matrix.deployment_environment }}" --setting-names \
            "NODE_ENV=production" \
            "NUXT_DATABASE_URL=$DATABASE_URL" \
            "NUXT_SESSION_PASSWORD=${{ secrets.AZURE_SESSION_SECRET }}" \
            "NUXT_GITHUB_REPO_TOKEN=${{ secrets.GITHUBS_REPO_TOKEN }}" \
            "NUXT_REDIS_HOST=$redis_host" \
            "NUXT_REDIS_PORT=6380" \
            "NUXT_REDIS_PASSWORD=$redis_password" \
            "NUXT_EMAIL_CLIENT=$email_connection_string" \
            "NUXT_SITE_URL=${{ matrix.site_url_setting }}"

      - name: Check HTTP status
        run: |
          sleep 30
          curl -s -w 'Establish Connection: %{time_connect}s\nTTFB: %{time_starttransfer}s\nTotal: %{time_total}s\n' ${{ matrix.url }} || true
          curl -s -w 'Establish Connection: %{time_connect}s\nTTFB: %{time_starttransfer}s\nTotal: %{time_total}s\n' ${{ matrix.url }}/api || true
        # The api returns 400 status code for some reason
        # with:
        #   url: ${{ matrix.url }}/api
        #   code: 200
        #   timeout: 300 # initial warm up can take quite some time
        #   interval: 30

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          TEST_URL: ${{ matrix.url }}
          # The tests need these tokens to run, but their actual value should not matter
          NUXT_GITHUB_REPO_TOKEN: 'SIGNAL_TO_RUN_TEST'
          # Re-enable when email sending in the test environment is fixed
          # NUXT_EMAIL_CLIENT: 'SIGNAL_TO_RUN_TEST'
